# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
version: "1"

projects:
  - name: Alliance Second Test Environment
    environments:
      - name: Production
        databases:
          - name: alliance-test
            databaseName: alliance_test
            user: alliance_test_user
            region: ohio
            postgresMajorVersion: "18"
            plan: basic-256mb
            diskSizeGB: 15
            storageAutoscalingEnabled: false
            ipAllowList:
              - source: 0.0.0.0/0
                description: temporary-test-access-pending-bemi-ardent-egress-ips

        services:
          - type: pserv
            name: alliance-postgres-18
            runtime: docker
            region: ohio
            plan: starter
            dockerfilePath: ./Dockerfile
            dockerContext: .
            envVars:
              - key: POSTGRES_DB
                value: alliance_test
              - key: POSTGRES_USER
                value: alliance_test_user
              - key: POSTGRES_PASSWORD
                generateValue: true
              - key: BEMI_REPLICATION_PASSWORD
                generateValue: true
              - key: ARDENT_REPLICATION_PASSWORD
                generateValue: true
              - key: PGDATA
                value: /data/postgres
              - key: POSTGRES_INITDB_ARGS
                value: "--auth-host=scram-sha-256"
              - key: POSTGRES_SSL_COMMON_NAME
                value: alliance-postgres-18
            disk:
              name: alliance-postgres-18-data
              mountPath: /data
              sizeGB: 10

          - type: worker
            name: alliance-bemi-worker
            runtime: image
            image:
              url: public.ecr.aws/bemi/dev:latest
            region: ohio
            plan: starter
            dockerCommand: ""
            envVars:
              - key: DB_HOST
                value: alliance-postgres-18
              - key: DB_PORT
                value: "10000"
              - key: DB_NAME
                value: alliance_test
              - key: DB_USER
                value: bemi_replication
              - key: DB_PASSWORD
                sync: false
              - key: DESTINATION_DB_HOST
                value: alliance-postgres-18
              - key: DESTINATION_DB_PORT
                value: "10000"
              - key: DESTINATION_DB_NAME
                value: alliance_test
              - key: DESTINATION_DB_USER
                value: alliance_test_user
              - key: DESTINATION_DB_PASSWORD
                sync: false

          - type: worker
            name: alliance-ardent-ngrok-tunnel
            runtime: docker
            region: ohio
            plan: starter
            dockerfilePath: ./Dockerfile.ngrok
            dockerContext: .
            envVars:
              - key: NGROK_UPSTREAM
                value: alliance-postgres-18:10000
              - key: NGROK_AUTHTOKEN
                sync: false
              - key: NGROK_TCP_URL
                sync: false